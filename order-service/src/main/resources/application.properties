spring.application.name=order-service
server.port=9091
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# configure rabitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.cloud.function.definition=consumeAsk

# configure rabbitmq queues
spring.cloud.stream.bindings.orderCreatedEvent-out-0.destination=order-exchange
spring.cloud.stream.bindings.orderCreatedEvent-out-0.content-type=application/json
spring.cloud.stream.bindings.orderCreatedEvent-out-0.group=${spring.application.name}
# order-exchange is exchange name

# configure rabbitmq queues
spring.cloud.stream.bindings.consumeAsk-in-0.destination=order-ack
spring.cloud.stream.bindings.consumeAsk-in-0.content-type=application/json
spring.cloud.stream.bindings.consumeAsk-in-0.group=${spring.application.name}